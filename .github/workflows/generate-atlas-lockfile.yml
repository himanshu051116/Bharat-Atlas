name: Generate pinned dependency lockfile

on:
  push:
    branches: [atlas-v1.11-release-staging]
    paths:
      - '.github/workflows/generate-atlas-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Generate deterministic package lock
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const p=require("./package-lock.json");if(p.version!=="1.12.0"||p.packages["node_modules/maplibre-gl"].version!=="6.16.0")process.exit(1)'
      - name: Commit lockfile on staging without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already committed'
          else
            git commit -m 'Pin vetted Bharat Atlas dependencies v1.12 [skip ci]'
            git push origin HEAD:atlas-v1.11-release-staging
          fi
