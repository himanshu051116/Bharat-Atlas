name: Apply tested Bharat Atlas v1.13 upgrade

on:
  push:
    branches:
      - atlas-v1.11-release-staging
    paths:
      - '.github/workflows/apply-bharat-v113.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify exact patch and apply source changes
        run: |
          echo '7a7627e469e6de3b9a3410a807e4ad8606cc1879c0bddf528ca1334873693e86  .staging/bharat-v113.patch.gz' | sha256sum -c -
          gzip -dc .staging/bharat-v113.patch.gz | git apply --check
          gzip -dc .staging/bharat-v113.patch.gz | git apply
      - name: Install locked dependencies and build with tests
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm audit --audit-level=high
      - name: Commit verified upgrade and delete temporary release inputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/apply-bharat-v113.yml .staging/bharat-v113.patch.gz
          git add -A
          git commit -m 'Bharat Atlas v1.13: optional local boundary persistence and privacy controls'
          git push origin HEAD:atlas-v1.11-release-staging
