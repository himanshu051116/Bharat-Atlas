name: Bharat Atlas research checks (no deploy)
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install topology QA dependencies
        run: pip install -r requirements-geo.txt
      - name: Validate geographic utilities
        run: node --test tests/*.test.mjs
      - name: Run Python build and GIS unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build local artifact and validate syntax
        run: |
          python scripts/build.py
          node --check dist/app.bundle.js
          python scripts/verify_preview.py
          python scripts/package_preview.py --output /tmp/bharat-atlas-tested-preview.zip
          python scripts/release_guard.py --target preview
          test ! -e dist/data/states.provisional.geojson
          test -f dist/data/gazetteer/places.geojson
          test -f dist/data/gazetteer/SOURCE-AND-LICENCE.txt
          test -f dist/data/hydrography/rivers.geojson
          test -f dist/data/landcover/land.geojson
          test -f dist/data/landcover/COPYING.LESSER
          test -f dist/data/hydrography/COPYING.LESSER
          test -f dist/data/tiles/atlas-tiles.json
      - name: Validate synthetic MVT pipeline (no copyrighted basemap scraping)
        run: |
          python scripts/build_vector_tiles.py --roads tests/fixtures/roads.geojson --rivers tests/fixtures/rivers.geojson --railways tests/fixtures/railways.geojson --settlements tests/fixtures/settlements.geojson --source-metadata tests/fixtures/tile-source.json --output /tmp/bharat-tiles-test --minzoom 4 --maxzoom 7
          python scripts/mvt_audit.py /tmp/bharat-tiles-test
      - name: Check each real geography source independently
        run: |
          python scripts/atlas_coverage_audit.py --output /tmp/atlas-v27-coverage.json
          python -c "import json; c=json.load(open('/tmp/atlas-v27-coverage.json')); assert not c['coreV1Ready'] and not c['transport']['roads'] and not c['transport']['railways']"
      - name: Verify Atlas Labs source and roadmap readiness
        run: |
          node --check dist/atlas-labs.mjs
          python scripts/audit_release_readiness.py --output /tmp/atlas-release-audit.json
          test -f dist/atlas-labs.html
          test -f dist/atlas-labs.css
      - name: Verify production gate remains closed
        run: '! python scripts/release_guard.py --target production'
