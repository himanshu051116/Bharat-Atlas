# Explicit opt-in browser proof; not a release or deployment workflow.
# This check FAILS on runners without real WebGL2 and does not create a mock.
name: Genuine MapLibre rendering proof (manual, no deploy)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install real browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Obtain exact official MapLibre 5.13.0 distribution
        run: python scripts/vendor_maplibre.py --fetch
      - name: Build exact local renderer and historical source tiles
        run: python scripts/build.py
      - name: Genuine desktop and mobile-emulation WebGL + MVT verification
        run: python scripts/run_renderer_proof.py --output docs/real-webgl-evidence
      - name: Upload evidence even if the GPU gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-webgl-proof
          path: docs/real-webgl-evidence/
          if-no-files-found: warn
